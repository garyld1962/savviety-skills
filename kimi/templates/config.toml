# Kimi Code CLI configuration
# https://moonshotai.github.io/kimi-cli/en/

# Skill discovery — keep merge_all_available_skills enabled so .claude/skills/
# is picked up alongside .kimi/skills/ (both contain the same content via the
# repo-skills installer).
merge_all_available_skills = true

# Step budget — match Kimi 1.40+ default of 1000 unless the project has a
# strong reason to clamp it.
max_steps_per_turn = 1000

# Extra skill dirs (optional). Uncomment and adjust to layer team-shared
# skills on top of project + user discovery.
# extra_skill_dirs = []

# ---------------------------------------------------------------------------
# Hooks
#
# Hooks are inline TOML arrays (not a separate hooks.json). Each hook fires
# on a Kimi lifecycle event with optional matcher regex.
#
# Event types: PreToolUse, PostToolUse, PostToolUseFailure, UserPromptSubmit,
#   Stop, StopFailure, SessionStart, SessionEnd, SubagentStart, SubagentStop,
#   PreCompact, PostCompact, Notification.
#
# Exit code semantics:
#   0  = allow; non-empty stdout is added to context
#   2  = block; stderr fed back to the model
#   *  = allow; stderr logged only
#
# The shell scripts shipped under .kimi/install-scan/ and .kimi/pr-guardrail/
# were originally authored for Claude Code. They read $CLAUDE_PROJECT_DIR and
# expect Claude's hook stdin shape. Kimi passes JSON on stdin including
# session_id, cwd, hook_event_name, and event-specific fields — verify the
# script accepts $cwd / parses Kimi's JSON correctly before relying on these.
# ---------------------------------------------------------------------------

# install-scan: post-Shell hook that detects package install commands and
# scans named packages against OSV.dev. Detect-and-report only; never blocks.
# [[hooks]]
# event   = "PostToolUse"
# matcher = "Shell"
# command = "bash ./.kimi/install-scan/install-scan.sh"
# timeout = 30

# pr-guardrail: pre-Shell hook that intercepts `gh pr create` and checks for
# existing open PRs before allowing the command.
# [[hooks]]
# event   = "PreToolUse"
# matcher = "Shell"
# command = "bash ./.kimi/pr-guardrail/pr-guardrail.sh"
# timeout = 15

# journal: session lifecycle journaling. Append-only.
# [[hooks]]
# event   = "SessionStart"
# command = "bash ./.kimi/journal/append.sh start"
# timeout = 5
#
# [[hooks]]
# event   = "SessionEnd"
# command = "bash ./.kimi/journal/append.sh end"
# timeout = 5

# Hooks are commented out by default. Uncomment after verifying the script
# behaves correctly under Kimi's hook stdin format. Test with `kimi --dry-run`
# or in a scratch directory before enabling globally.
