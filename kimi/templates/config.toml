# Kimi Code CLI configuration
# https://moonshotai.github.io/kimi-cli/en/

# Skill discovery — keep merge_all_available_skills enabled so .claude/skills/
# (Claude Code assets) are merged with .kimi/skills/ (native Kimi assets from
# the savviety-workflows plugin). Priority: kimi > claude > codex.
merge_all_available_skills = true

# Step budget — match Kimi 1.40+ default of 1000 unless the project has a
# strong reason to clamp it.
max_steps_per_turn = 1000

# Extra skill dirs (optional). Uncomment and adjust to layer team-shared
# skills on top of project + user discovery.
# extra_skill_dirs = []
