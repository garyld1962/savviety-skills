# ./.jev-gate.toml
# Project-local overrides for the jev-gate FastMCP server and bin/jev-shell-hook.
# Uses the same schema as ~/.config/jev-gate/config.toml; the server rejects unknown keys.
# Precedence: Runtime Tool Args > Project-Local (this file) > User-Global (~/.config/jev-gate/config.toml)
# Lists REPLACE the global value (they do not append); tables merge recursively.

# Architectural invariants checked by verify_code_invariants(git_diff). Each entry is a plain
# sentence the diff must satisfy; at most 20. This list replaces the global invariants.
invariants = [
  "<FILL IN: Keep domain and business logic out of transport, CLI, and controller layers.>",
  "Do not hardcode environment URLs, ports, credentials, or magic configuration constants.",
  "Do not mutate shared concurrent or async state without a lock, transaction, or atomic primitive.",
]

# [thresholds]
# Optional per-project overrides of the global thresholds:
# deep_lane_confidence_min = 0.65
# auto_execute_tool_min = 0.85
# perplexity_synthesis_min = 0.80
# invariant_violation_min = 0.80

[search.domain_allowlists]
# Plain domain names only (no "site:" prefix). Each key replaces the same global key.
software_arch = ["github.com", "docs.rs", "developer.mozilla.org"]
