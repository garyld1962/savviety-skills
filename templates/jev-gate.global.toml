# ~/.config/jev-gate/config.toml
# User-global configuration for the local RTX 5090 System-1 Jev decision gate.
# Precedence: Runtime Tool Args > Project-Local (./.jev-gate.toml) > User-Global (~/.config/jev-gate/config.toml)

[endpoint]
url = "<FILL IN: http://sherlock:8000/v1/systemone>"
model = "<FILL IN: vllm-sr/Decision-1.0-Nox-4B>"
timeout_ms = 250
fallback_mode = "graceful" # "graceful" (deep_lane + static blocklist + logged skip) or "fail_closed"

[lanes.claude]
fast_lane = "sonnet"
deep_lane = "opus"

[lanes.gemini]
fast_lane = "gemini-2.5-flash"
deep_lane = "gemini-2.5-pro"

[lanes.openai]
fast_lane = "gpt-4.1-mini"
deep_lane = "o3"

[thresholds]
lane_confidence = 0.65          # Below 0.65 -> automatically fall back to deep_lane
perplexity_escalation = 0.80    # needs_perplexity_synthesis >= 0.80 -> escalate to Perplexity MCP
shell_auto_execute = 0.85       # safe_auto_execute >= 0.85 -> auto-execute without confirmation
invariant_violation = 0.80      # noul >= 0.80 on an invariant failure condition -> block and fix
file_keep_full = 0.70           # score >= 0.70 -> keep_full
file_keep_signatures = 0.35     # 0.35 <= score < 0.70 -> keep_signatures_only; < 0.35 -> drop

[search]
global_blocklist = [
  "-site:linkedin.com",
  "-site:pinterest.com",
  "-site:quora.com",
  "-site:medium.com"
]

[search.domain_allowlists]
software_arch = [
  "site:github.com",
  "site:docs.rs",
  "site:developer.mozilla.org",
  "site:learn.microsoft.com",
  "site:arxiv.org"
]
rust_cad = [
  "site:docs.rs",
  "site:crates.io",
  "site:github.com"
]
3d_printing = [
  "site:printables.com",
  "site:vorondesign.com",
  "site:klipper3d.org",
  "site:github.com"
]
