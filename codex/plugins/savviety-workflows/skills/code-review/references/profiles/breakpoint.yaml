---
id: breakpoint
title: Breakpoint Review
description: >
  Light mid-flow review that runs at milestone boundaries during plan
  execution. Focuses on the lenses that catch showstoppers early: security
  issues, correctness bugs, and thin test coverage. Skips the heavier
  lenses (performance, resilience, operability, architecture) — those run
  at the PR boundary via the `full` profile.

  This profile is optimized for speed so execute-plan can run it after
  every milestone without stalling progress.

domains:
  - id: concept/security
    mode: always
  - id: concept/correctness
    mode: always
  - id: concept/tests
    mode: always

# Mid-flow rationale: at a milestone boundary, missing test coverage is a
# stronger signal than at PR boundary — later tasks may land more tests,
# but a milestone shipping without coverage is a choice that deserves
# immediate attention. PR-boundary reviews use `full` (no bump) because
# later milestones may still have filled the gap.
severity_bump:
  - domain: concept/tests
    from: minor
    to: major
